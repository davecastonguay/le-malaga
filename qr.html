<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Malaga · QR codes</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* One Letter page of 10 trilingual QR stickers. Cut along the dashed lines. */
@page{size:Letter;margin:10mm}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#15252a;font-family:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif}
.sheet{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:2.45in;max-width:8.5in;margin:0 auto}
.lab{border:1px dashed #b9c4c3;display:grid;justify-items:center;align-content:center;gap:4px;padding:8px;text-align:center}
.lab img{width:1.45in;height:1.45in;background:#fff;padding:4px}
.lab b{font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;font-size:15pt;font-weight:800;line-height:1.05}
.lab .tr{font-size:9pt;color:#56686c;line-height:1.25}
.lab .sc{font-size:7.5pt;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#1d5a63}
.lab.main{background:#e3eeee}
</style>
</head>
<body>
<div class="sheet" id="s"></div>
<script src="content.js"></script>
<script>
const items=[["site",l=>T[l].brand,l=>T[l].titleTail],["door",l=>T[l].cards.door.t],["fire",l=>T[l].cards.fire.t],["stove",l=>T[l].cards.stove.t],["patio",l=>T[l].cards.patio.t],["win",l=>T[l].cards.win.t],["heat",l=>T[l].cards.heat.t],["vinyl",l=>T[l].cards.vinyl.t],["partir",l=>T[l].leaveH],["urgences",l=>T[l].urgH]];
document.getElementById("s").innerHTML=items.map(([k,f,g])=>`<div class="lab${k==="site"?" main":""}"><img src="img/qr/${k}.svg" alt=""><b>${k==="site"?"Le Malaga":f("fr")}</b><span class="tr">${k==="site"?["fr","en","es"].map(g).join(" · "):f("en")+" · "+f("es")}</span><span class="sc">Scannez · Scan · Escanee</span></div>`).join("");
</script>
</body>
</html>
