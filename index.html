<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guide de la maison du lac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one calm column like a guest binder; tappable "fiches" open a sheet with steps + a small animated demo */
:root{
  --paper:#eef2f1; --card:#ffffff; --ink:#15252a; --muted:#56686c; --line:#d3dcdb;
  --lake:#1d5a63; --lake-soft:#d6e7e7; --maple:#b9471f; --maple-soft:#f6e1d6; --sky:#cfe0e3;
  --hill1:#2f5c4a; --hill2:#c6702f; --hill3:#9b3d22; --water:#3d7d86;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d181b; --card:#14242a; --ink:#e4eceb; --muted:#9db0b2; --line:#253a40;
  --lake:#7cc3c8; --lake-soft:#1b3439; --maple:#ec8a5f; --maple-soft:#3a2219; --sky:#1a2d33;
  --hill1:#244a3c; --hill2:#8f4f22; --hill3:#6e2b18; --water:#2a5c64; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0d181b; --card:#14242a; --ink:#e4eceb; --muted:#9db0b2; --line:#253a40;
  --lake:#7cc3c8; --lake-soft:#1b3439; --maple:#ec8a5f; --maple-soft:#3a2219; --sky:#1a2d33;
  --hill1:#244a3c; --hill2:#8f4f22; --hill3:#6e2b18; --water:#2a5c64; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h2{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--maple);outline-offset:2px;border-radius:6px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;flex:1;min-width:0}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.lang button{border:0;background:none;padding:5px 12px;border-radius:999px;font-weight:700;font-size:.85rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--lake);color:var(--paper)}

/* hero */
.hero{margin-top:18px;border-radius:18px;overflow:hidden;background:var(--sky);position:relative}
.hero svg{display:block;width:100%;height:auto}
.hero-img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:center 60%}
.hero-cap{position:absolute;left:12px;bottom:12px;font-size:.8rem;font-weight:700;padding:5px 10px;border-radius:999px;background:rgb(0 0 0 / .55);color:#fff}
.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px}
.gallery figure{margin:0;flex:0 0 min(78%,340px);scroll-snap-align:start;display:grid;gap:6px}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--lake-soft)}
.gallery figcaption{font-size:.88rem;color:var(--muted)}
.gallery figcaption b{color:var(--ink);font-family:var(--display);font-size:1rem;display:block}
.wide{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px}
.note.with-img{grid-template-columns:minmax(0,120px) minmax(0,1fr);align-items:start;gap:14px}
.note.with-img img{border-radius:10px;aspect-ratio:1;object-fit:cover;width:100%}
.ripple{animation:drift 7s ease-in-out infinite}
.ripple:nth-child(2){animation-delay:-2s}.ripple:nth-child(3){animation-delay:-4s}
@keyframes drift{50%{transform:translateX(14px)}}
.intro{display:grid;gap:12px;padding-block:22px 6px}
.intro h1{font-size:clamp(2rem,7vw,2.9rem);font-weight:800;letter-spacing:-.02em}
.intro h1 em{font-style:normal;color:var(--maple)}
.intro p{color:var(--muted);max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.facts span{font-size:.85rem;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card)}

section{margin-top:40px;display:grid;gap:14px}
.sec-head{display:grid;gap:4px}

/* fiche grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fiche{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s}
.fiche:hover{transform:translateY(-2px)}
.fiche .ph{aspect-ratio:4/3;width:100%;background:var(--lake-soft) center/cover no-repeat}
.fiche .t{padding:10px 12px 12px;display:grid;gap:2px}
.fiche .t b{font-family:var(--display);font-size:1.02rem}
.fiche .t small{color:var(--muted);font-size:.82rem;line-height:1.3}

/* notes */
.note{border-radius:14px;padding:16px;display:grid;gap:8px;border:1px solid var(--line);background:var(--card)}
.note.warn{background:var(--maple-soft);border-color:transparent}
.note.warn h3{color:var(--maple)}
.note.eco{background:var(--lake-soft);border-color:transparent}
.note.eco h3{color:var(--lake)}
ul.pts{margin:0;padding-left:1.1em;display:grid;gap:4px}

/* checklist */
.check{display:grid;gap:8px}
.check label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--lake);flex:none;margin-top:1px}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.progress{font-size:.9rem;color:var(--muted)}
.places{display:grid;gap:10px}
@media(min-width:620px){.places{grid-template-columns:repeat(2,minmax(0,1fr))}}
.place{display:grid;gap:4px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;text-decoration:none}
.place:hover{border-color:var(--lake)}
.place b{font-family:var(--display);font-size:1.05rem}
.place .k{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--maple)}
.place span:last-child{font-size:.92rem;color:var(--muted)}
.place .go{font-size:.82rem;font-weight:700;color:var(--lake)}
.soon{border:1.5px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted);display:grid;gap:6px}
.soon b{color:var(--ink);font-family:var(--display)}

/* sheet */
dialog{border:0;padding:0;width:min(640px,100%);max-height:92vh;border-radius:20px 20px 0 0;margin:auto auto 0;background:var(--paper);color:var(--ink)}
@media(min-width:620px){dialog{border-radius:20px;margin:auto}}
dialog::backdrop{background:rgb(0 0 0 / .45)}
.sh{display:grid;gap:18px;padding:18px 16px 28px}
.sh-top{display:flex;align-items:center;gap:10px}
.sh-top h2{flex:1;min-width:0}
.x{border:1px solid var(--line);background:var(--card);border-radius:999px;width:38px;height:38px;font-size:1.2rem;line-height:1}
.photos{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}
.photos figure{margin:0;flex:0 0 72%;max-width:300px;scroll-snap-align:start;display:grid;gap:4px}
.photos img{border-radius:12px;aspect-ratio:3/4;object-fit:cover;width:100%}
.photos figcaption{font-size:.8rem;color:var(--muted)}
.block{display:grid;gap:8px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:8px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--lake);color:var(--paper);font-weight:700;font-size:.85rem;display:grid;place-items:center}
.tip{font-size:.92rem;padding:10px 12px;border-radius:10px;background:var(--maple-soft)}
.tip b{color:var(--maple)}

/* demos */
.demo{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px;display:grid;gap:12px}
.demo .stage{display:grid;place-items:center;min-height:200px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;font-size:.88rem;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--lake);border-color:var(--lake);color:var(--paper)}
.cap{font-size:.95rem;min-height:2.8em}
.cap b{color:var(--lake)}

/* window demo */
.win{width:150px;height:190px;perspective:600px;position:relative}
.frame{position:absolute;inset:0;border:7px solid var(--ink);border-radius:4px;background:linear-gradient(var(--sky),var(--hill1))}
.sash{position:absolute;inset:7px;border:6px solid var(--ink);background:rgb(255 255 255 / .18);transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.handle{position:absolute;right:-1px;top:50%;width:8px;height:34px;margin-top:-4px;background:var(--maple);border-radius:4px;transform-origin:50% 4px;transition:transform .45s}
.win[data-s="closed"] .handle{transform:rotate(0deg)}
.win[data-s="turn"] .handle{transform:rotate(90deg)}
.win[data-s="tilt"] .handle{transform:rotate(180deg)}
.win[data-s="turn"] .sash{transform-origin:left center;transform:rotateY(-48deg)}
.win[data-s="tilt"] .sash{transform-origin:center bottom;transform:rotateX(18deg)}

/* patio demo */
.patio{width:230px;height:170px;position:relative;border:6px solid var(--ink);border-radius:4px;background:linear-gradient(var(--sky) 55%,var(--water));overflow:hidden}
.panel{position:absolute;top:4px;bottom:4px;right:4px;width:48%;border:6px solid var(--ink);background:rgb(255 255 255 / .2);transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.panel .ph2{position:absolute;left:4px;top:50%;width:7px;height:30px;margin-top:-4px;background:var(--maple);border-radius:4px;transform-origin:50% 4px;transform:rotate(180deg);transition:transform .45s}
.fixed{position:absolute;top:4px;bottom:4px;left:4px;width:48%;border:6px solid var(--ink)}
.rollers{position:absolute;bottom:-1px;left:8px;right:8px;height:6px;display:flex;justify-content:space-between;opacity:0;transition:opacity .3s}
.rollers i{width:6px;height:6px;border-radius:50%;background:var(--maple)}
.patio[data-s="lift"] .ph2,.patio[data-s="open"] .ph2{transform:rotate(0deg)}
.patio[data-s="lift"] .panel{transform:translateY(-4px)}
.patio[data-s="open"] .panel{transform:translate(-88%,-4px)}
.patio[data-s="lift"] .rollers,.patio[data-s="open"] .rollers{opacity:1}

/* fire demo */
.fire svg{width:220px;max-width:100%;height:auto}
.layer{opacity:0;transform:translateY(-14px);transition:opacity .4s,transform .5s cubic-bezier(.3,.7,.2,1)}
.layer.on{opacity:1;transform:none}
.flame{transform-origin:110px 112px;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.06,.93)}}

/* stove demo */
.knob{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--card),var(--line));border:3px solid var(--ink);position:relative;transition:transform .5s}
.knob::after{content:"";position:absolute;left:50%;top:8px;width:6px;height:26px;margin-left:-3px;background:var(--maple);border-radius:3px}
.stove{display:grid;justify-items:center;gap:10px}
.burner{width:140px;height:44px;position:relative}
.burner .ring{position:absolute;left:20px;right:20px;bottom:0;height:14px;border-radius:50%;background:var(--ink)}
.burner .fl{position:absolute;bottom:8px;width:10px;height:22px;border-radius:50% 50% 40% 40%;background:#3a7bff;opacity:0;transform:scaleY(.2);transform-origin:bottom;transition:.35s}
.stove[data-s="lit"] .fl{opacity:.9;transform:scaleY(1);animation:flick .35s infinite alternate}
.spark{font-weight:800;color:var(--maple);font-family:var(--display);opacity:0;transition:opacity .2s;height:1.2em}
.stove[data-s="push"] .knob{transform:scale(.92) rotate(-50deg)}
.stove[data-s="click"] .knob,.stove[data-s="lit"] .knob{transform:rotate(-50deg)}
.stove[data-s="click"] .spark{opacity:1}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
footer{margin-top:44px;color:var(--muted);font-size:.85rem;text-align:center}
</style>
</head>

<div class="bar"><div class="in">
  <div class="brand" data-t="brand"></div>
  <div class="lang" role="group" aria-label="Langue / Language">
    <button id="fr" aria-pressed="true">FR</button><button id="en" aria-pressed="false">EN</button>
  </div>
</div></div>

<div class="wrap">
  <div class="hero"><video class="hero-img amb" src="img/terrasse.mp4" poster="img/terrasse-poster.jpg" autoplay muted loop playsinline aria-hidden="true"></video><span class="hero-cap" data-t="heroCap"></span></div>
  <div class="hero-old" hidden aria-hidden="true">
    <svg viewBox="0 0 400 170" preserveAspectRatio="xMidYMid slice">

      <path d="M0 92 Q60 50 120 80 T240 70 T400 78 V110 H0Z" fill="var(--hill1)"/>

      <path d="M0 106 Q90 92 200 104 T400 102 V114 H0Z" fill="var(--hill3)"/>
      <rect y="110" width="400" height="60" fill="var(--water)"/>
      <g stroke="var(--paper)" stroke-width="2" stroke-linecap="round" opacity=".55">
        <path class="ripple" d="M40 128 h50 M150 140 h70 M280 126 h44"/>
        <path class="ripple" d="M90 152 h40 M230 156 h60"/>
        <path class="ripple" d="M10 162 h30 M330 146 h50"/>
      </g>
      <g transform="translate(250 112)"><path d="M0 0 h40 l-6 8 h-28z" fill="var(--maple)"/><rect x="18" y="-14" width="2" height="14" fill="var(--ink)"/></g>
    </svg>
  </div>

  <div class="intro">
    <span class="eyebrow" data-t="where"></span>
    <h1 data-t="hello"></h1>

    <div class="facts" id="facts"></div>
  </div>

  <section>
    <div class="sec-head"><span class="eyebrow" data-t="tourEye"></span><h2 data-t="tourH"></h2></div>
    <div class="gallery" id="gallery"></div>
  </section>

  <section>
    <div class="sec-head"><span class="eyebrow" data-t="howEye"></span><h2 data-t="howH"></h2></div>
    <div class="grid" id="grid"></div>
    <div class="note eco"><h3 data-t="waterH"></h3><ul class="pts" data-l="water"></ul></div>
    <div class="note"><h3 data-t="pantryH"></h3><ul class="pts" data-l="pantry"></ul></div>
    <div class="note warn with-img"><img src="img/pingpong.jpg" alt=""><div><h3 data-t="pingH"></h3><ul class="pts" data-l="ping"></ul></div></div>
  </section>

  <section>
    <div class="sec-head"><span class="eyebrow" data-t="lakeEye"></span><h2 data-t="lakeH"></h2></div>
    <video class="wide amb" src="img/quai.mp4" poster="img/quai-poster.jpg" autoplay muted loop playsinline aria-hidden="true"></video>
    <div class="note eco"><h3 data-t="vestH"></h3><ul class="pts" data-l="vest"></ul></div>
    <div class="note warn"><h3 data-t="windH"></h3><ul class="pts" data-l="wind"></ul></div>
  </section>

  <section>
    <div class="sec-head"><span class="eyebrow" data-t="cleanEye"></span><h2 data-t="cleanH"></h2></div>
    <div class="note"><ul class="pts" data-l="clean"></ul></div>
    <div class="note eco"><h3 data-t="ecoH"></h3><ul class="pts" data-l="eco"></ul></div>
  </section>

  <section>
    <div class="sec-head"><span class="eyebrow" data-t="leaveEye"></span><h2 data-t="leaveH"></h2><p class="progress" id="prog"></p></div>
    <div class="check" id="check"></div>
  </section>

  <section>
    <div class="sec-head"><span class="eyebrow" data-t="soonEye"></span><h2 data-t="soonH"></h2></div>
    <p class="progress" data-t="aroundNote"></p>
    <h3 data-t="actH"></h3>
    <div class="places" id="acts"></div>
    <h3 data-t="foodH"></h3>
    <div class="places" id="food"></div>
  </section>

  <footer data-t="foot"></footer>
</div>

<dialog id="sheet" aria-labelledby="shT"><div class="sh" id="sh"></div></dialog>

const IMG={door:["img/porte-ext.jpg","img/porte-int.jpg"],fire:["img/bois.jpg","img/foyer.jpg"],stove:["img/cuisiniere.jpg"],patio:["img/patio.jpg"],win:["img/fenetre.jpg"],heat:["img/thermostat.jpg"]};
const ORDER=["door","fire","stove","patio","win","heat"];
let L="fr";try{L=localStorage.getItem("lang")||"fr"}catch(e){}
let done={};try{done=JSON.parse(localStorage.getItem("done")||"{}")}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>s;

function render(){
  const t=T[L];document.documentElement.lang=L;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t[el.dataset.t];if(typeof v==="string")el.innerHTML=v});
  document.querySelectorAll("[data-l]").forEach(el=>el.innerHTML=t[el.dataset.l].map(x=>`<li>${x}</li>`).join(""));
  $("#facts").innerHTML=t.facts.map(f=>`<span>${f}</span>`).join("");
  $("#gallery").innerHTML=t.tour.map(([f,h,p])=>`<figure><img src="img/${f}.jpg" alt="${h}" loading="lazy"><figcaption><b>${h}</b>${p}</figcaption></figure>`).join("");
  $("#grid").innerHTML=ORDER.map(k=>{const c=t.cards[k];return `<button class="fiche" data-k="${k}"><span class="ph" style="background-image:url('${IMG[k][IMG[k].length-1]}')"></span><span class="t"><b>${c.t}</b><small>${c.s}</small></span></button>`}).join("");
  const pl=a=>a.map(([k,n,d,q])=>`<a class="place" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}" target="_blank" rel="noopener"><span class="k">${k}</span><b>${n}</b><span>${d}</span><span class="go">${t.map}</span></a>`).join("");
  $("#acts").innerHTML=pl(t.acts);$("#food").innerHTML=pl(t.food);
  $("#check").innerHTML=t.leave.map((x,i)=>`<label><input type="checkbox" id="c${i}" ${done[i]?"checked":""}><span>${x}</span></label>`).join("");
  prog();
  $("#fr").setAttribute("aria-pressed",L==="fr");$("#en").setAttribute("aria-pressed",L==="en");
  document.title=L==="fr"?"Guide de la maison du lac":"Lake House Guide";
}
function prog(){const n=T[L].leave.length,d=[...Array(n).keys()].filter(i=>done[i]).length;$("#prog").textContent=T[L].prog(d,n)}
$("#check").addEventListener("change",e=>{const i=+e.target.id.slice(1);done[i]=e.target.checked;try{localStorage.setItem("done",JSON.stringify(done))}catch(x){}prog()});
["fr","en"].forEach(l=>$("#"+l).onclick=()=>{L=l;try{localStorage.setItem("lang",l)}catch(e){}render();if(cur&&$("#sheet").open)openSheet(cur)});

let cur=null;
function openSheet(k){
  cur=k;const t=T[L],c=t.cards[k];
  let h=`<div class="sh-top"><h2 id="shT">${c.t}</h2><button class="x" aria-label="${t.close}" onclick="document.getElementById('sheet').close()">×</button></div>`;
  h+=`<div class="photos">${IMG[k].map((src,i)=>`<figure><img src="${src}" alt="${c.caps[i]||c.t}"><figcaption>${c.caps[i]||""}</figcaption></figure>`).join("")}</div>`;
  if(c.tip)h+=`<p class="tip">${c.tip}</p>`;
  c.blocks.forEach(b=>{
    h+=`<div class="block"><h3>${b.h}</h3>`;
    if(b.demo)h+=demo(b.demo,c);
    if(b.steps)h+=`<ol class="steps">${b.steps.map(s=>`<li><span>${s}</span></li>`).join("")}</ol>`;
    h+=`</div>`});
  $("#sh").innerHTML=h;wire(k,c);
  if(!$("#sheet").open)$("#sheet").showModal();
}
$("#grid").addEventListener("click",e=>{const b=e.target.closest(".fiche");if(b)openSheet(b.dataset.k)});
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")e.target.close()});

function demo(type,c){
  const t=T[L];
  if(type==="win")return `<div class="demo"><div class="stage"><div class="win" id="dw" data-s="closed"><div class="frame"></div><div class="sash"><div class="handle"></div></div></div></div>
    <div class="seg">${c.win.map((w,i)=>`<button data-i="${i}" aria-pressed="${i===0}">${w[0]}</button>`).join("")}</div><p class="cap" id="dc"><b>${c.win[0][0]}.</b> ${c.win[0][1]}</p></div>`;
  if(type==="patio")return `<div class="demo"><div class="stage"><div class="patio" id="dp" data-s="closed"><div class="fixed"></div><div class="panel"><div class="ph2"></div><div class="rollers"><i></i><i></i></div></div></div></div>
    <div class="seg">${c.patio.map((w,i)=>`<button data-i="${i}" aria-pressed="${i===0}">${w[0]}</button>`).join("")}</div><p class="cap" id="dc"><b>${c.patio[0][0]}.</b> ${c.patio[0][1]}</p></div>`;
  if(type==="fire")return `<div class="demo fire"><div class="stage"><svg viewBox="0 0 220 170" role="img" aria-label="${c.t}">
      <rect x="6" y="6" width="208" height="158" rx="6" fill="var(--ink)"/><rect x="18" y="18" width="184" height="134" rx="3" fill="var(--paper)" opacity=".12"/>
      <g class="layer" id="f0"><rect x="30" y="122" width="160" height="24" rx="12" fill="#7a4a2a"/><rect x="34" y="100" width="152" height="22" rx="11" fill="#8b5a33"/><circle cx="42" cy="134" r="9" fill="#d6a46f"/><circle cx="178" cy="111" r="8" fill="#d6a46f"/></g>
      <g class="layer" id="f1"><rect x="44" y="84" width="132" height="16" rx="8" fill="#a06b3f"/><rect x="52" y="70" width="116" height="15" rx="7" fill="#946238"/></g>
      <g class="layer" id="f2" stroke="#d9b47c" stroke-width="5" stroke-linecap="round"><path d="M70 66 L150 56 M74 56 L148 66 M86 62 L134 52"/></g>
      <g class="layer" id="f3"><path class="flame" d="M110 20 C126 38 132 48 124 60 C120 54 116 52 116 52 C118 60 112 66 104 64 C96 62 92 54 98 44 C100 50 104 50 104 50 C100 38 106 30 110 20Z" fill="var(--maple)"/></g>
    </svg></div><p class="cap" id="dc"></p><div class="seg"><button id="fn">${t.next}</button></div></div>`;
  if(type==="stove")return `<div class="demo"><div class="stage"><div class="stove" id="ds" data-s="off"><div class="burner">${[30,45,60,75,90,105].map(x=>`<span class="fl" style="left:${x}px"></span>`).join("")}<span class="ring"></span></div><div class="spark">clic !</div><div class="knob"></div></div></div>
    <p class="cap" id="dc"><b>1.</b> ${c.stove[0]}</p><div class="seg"><button id="sn">${t.light}</button></div></div>`;
  return "";
}
function wire(k,c){
  const t=T[L];
  const seg=(id,arr,states)=>{const box=$("#"+id);document.querySelectorAll(".seg [data-i]").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;box.dataset.s=states[i];document.querySelectorAll(".seg [data-i]").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#dc").innerHTML=`<b>${arr[i][0]}.</b> ${arr[i][1]}`})};
  if(k==="win")seg("dw",c.win,["closed","turn","tilt"]);
  if(k==="patio")seg("dp",c.patio,["closed","lift","open"]);
  if(k==="fire"){let n=-1;const step=()=>{n++;if(n>3){n=-1;document.querySelectorAll(".layer").forEach(l=>l.classList.remove("on"));$("#dc").textContent="";$("#fn").textContent=t.next;return}
      $("#f"+n).classList.add("on");$("#dc").innerHTML=`<b>${n+1}.</b> ${c.fire[n]}`;$("#fn").textContent=n===3?t.again:t.next};$("#fn").onclick=step;step()}
  if(k==="stove"){const st=["off","push","click","lit"];let n=0,tm=[];$("#sn").onclick=()=>{tm.forEach(clearTimeout);tm=[];const go=i=>{$("#ds").dataset.s=st[i];$("#dc").innerHTML=`<b>${i+1}.</b> ${c.stove[i]}`};
      if($("#ds").dataset.s==="lit"){go(0);$("#sn").textContent=t.light;return}go(1);tm.push(setTimeout(()=>go(2),1100),setTimeout(()=>{go(3);$("#sn").textContent=t.again},2800))}}
}
render();
if(matchMedia("(prefers-reduced-motion: reduce)").matches)document.querySelectorAll("video.amb").forEach(v=>{v.removeAttribute("autoplay");v.pause()});
</script>
